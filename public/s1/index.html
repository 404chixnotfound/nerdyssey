<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030806">
<meta name="robots" content="noindex">
<title>THE NERDYSSEY // S1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030806; --panel:#0B1A14; --text:#B6FFE0; --accent:#00FF9C; --dim:#1F5A43; --red:#FF3B5C;
  --glow:0 0 8px rgba(0,255,156,.55),0 0 22px rgba(0,255,156,.25);
  --head:'Orbitron','VT323',monospace; --lcd:'VT323',monospace; --body:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;min-height:100vh;max-width:560px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(600px 400px at 50% -5%,rgba(0,255,156,.08),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:flick 6s infinite}
@keyframes flick{0%,100%{opacity:.9}50%{opacity:1}52%{opacity:.8}54%{opacity:1}}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

.br{position:relative;border:1px solid var(--dim);background:var(--panel)}
.br::before{content:"";position:absolute;inset:-1px;pointer-events:none;--c:var(--accent);--s:12px;
  background:
   linear-gradient(var(--c),var(--c)) top left/var(--s) 2px no-repeat,linear-gradient(var(--c),var(--c)) top left/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) top right/var(--s) 2px no-repeat,linear-gradient(var(--c),var(--c)) top right/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom left/var(--s) 2px no-repeat,linear-gradient(var(--c),var(--c)) bottom left/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom right/var(--s) 2px no-repeat,linear-gradient(var(--c),var(--c)) bottom right/2px var(--s) no-repeat;
  filter:drop-shadow(0 0 4px rgba(0,255,156,.6))}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--head);font-weight:900;font-size:clamp(20px,6.4vw,30px);letter-spacing:.05em;color:var(--accent);
  text-shadow:var(--glow);position:relative;line-height:1;white-space:nowrap;text-decoration:none;animation:glitch 7s infinite}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;opacity:0;pointer-events:none}
.logo::before{color:#00e5ff;transform:translate(-2px,0)}
.logo::after{color:var(--red);transform:translate(2px,0)}
.logo:active::before,.logo:active::after{opacity:.75;animation:gshift .35s steps(2) infinite}
@keyframes gshift{0%{clip-path:inset(0 0 60% 0)}50%{clip-path:inset(40% 0 20% 0)}100%{clip-path:inset(70% 0 0 0)}}
@keyframes glitch{0%,94%,100%{transform:none}95%{transform:translate(2px,-1px) skewX(4deg)}96%{transform:translate(-2px,1px)}97%{transform:none}}
.tag{letter-spacing:.22em;color:var(--dim);font-size:10px;margin-top:-6px}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0 14px;min-height:44px;
  letter-spacing:.12em;font-size:12px;text-transform:uppercase;transition:.12s;display:inline-flex;gap:8px;align-items:center;justify-content:center;font-family:var(--body);text-decoration:none}
.btn:active{transform:scale(.94);box-shadow:inset 0 0 12px rgba(0,255,156,.5)}
.btn.solid{background:var(--accent);color:#03130c;font-weight:700}
.btn.wide{width:100%;min-height:52px;font-size:14px}
.btn:disabled{opacity:.5}

.banner{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 14px;text-align:center;box-shadow:inset 0 0 40px rgba(0,255,156,.08),var(--glow)}
.banner .lab{letter-spacing:.24em;font-size:11px}
.banner .mid{font-family:var(--head);font-weight:700;font-size:clamp(19px,6.2vw,28px);letter-spacing:.06em;color:var(--accent);text-shadow:var(--glow)}
.banner .right{letter-spacing:.22em;font-size:11px}
.caret{display:inline-block;width:.5em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.vault{padding:20px 16px 22px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.ph{display:flex;justify-content:space-between;width:100%;font-size:10px;letter-spacing:.22em;color:var(--dim)}
.ph .u{color:var(--accent)}
.slot{width:min(220px,62vw);aspect-ratio:1;position:relative;display:grid;place-items:center}
.slot svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 10px var(--accent));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.slot .val{position:relative;font-family:var(--head);font-weight:900;font-size:clamp(72px,24vw,110px);line-height:1;color:var(--text);transition:.3s}
.locked .val{color:var(--dim);letter-spacing:.05em}
.locked .slot svg{filter:drop-shadow(0 0 6px var(--dim));animation:none}
.locked .slot svg polygon{stroke:var(--dim)}
.open .val{color:var(--accent);text-shadow:0 0 14px var(--accent),0 0 40px rgba(0,255,156,.6);animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0;filter:blur(8px)}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1;filter:none}}
.status{font-family:var(--head);font-weight:700;letter-spacing:.18em;font-size:14px;color:var(--dim)}
.open .status{color:var(--accent);text-shadow:var(--glow)}

form{width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
label{letter-spacing:.14em;font-size:14px}
input{width:100%;background:#06110c;border:1px solid var(--accent);color:var(--accent);padding:0 14px;min-height:54px;font-size:20px;letter-spacing:.18em;outline:none;font-family:var(--body);text-transform:uppercase}
input:focus{box-shadow:var(--glow)}
.err{min-height:24px;text-align:center;color:var(--red);font-family:var(--head);font-weight:700;letter-spacing:.18em;font-size:14px;text-shadow:0 0 8px var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.note{text-align:center;font-size:10px;letter-spacing:.2em;color:var(--dim)}
.hidden{display:none!important}
footer{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;letter-spacing:.2em;color:var(--dim);text-align:center;border-top:1px solid rgba(31,90,67,.6);padding-top:10px;margin-top:auto}
</style>
</head>
<body>

<header>
  <a class="logo" href="/" data-t="THE NERDYSSEY">THE NERDYSSEY</a>
  <a class="btn" href="/">&lt; BOARD</a>
</header>
<div class="tag">PLAY &gt; COMPETE &gt; BELONG</div>

<section class="br banner">
  <div class="lab">SECURE VAULT</div>
  <div class="mid" id="title">S1 // LOCKED</div>
  <div class="right">5 TRIES // THEN PERMANENT LOCK</div>
</section>

<section class="br vault locked" id="vault">
  <div class="ph"><span>ENCRYPTED DIGIT</span><span class="u" id="unit">SLOT S1</span></div>

  <div class="slot">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="25,6 75,6 98,50 75,94 25,94 2,50" fill="rgba(0,255,156,.08)" stroke="#00FF9C" stroke-width="2.5"/>
      <polygon points="27,12 73,12 92,50 73,88 27,88 8,50" fill="none" stroke="#00FF9C" stroke-width="1" opacity=".5"/>
    </svg>
    <div class="val" id="val" aria-live="polite">?</div>
  </div>

  <div class="status" id="status">STATUS: LOCKED</div>

  <form id="form" autocomplete="off">
    <label for="word">ENTER WORD &gt;</label>
    <input id="word" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="100" aria-label="Secret word">
    <div class="err" id="err"></div>
    <button class="btn solid wide" id="go" type="submit">UNLOCK</button>
  </form>

  <div class="note" id="note">— ACCESS RESTRICTED —</div>
</section>

<footer>
  <span>THE NERDYSSEY &nbsp; v1.1.0</span>
  <span>THE ART OF CRITICAL THINKING</span>
</footer>

<script>
(()=>{
const $=s=>document.querySelector(s);
const KEY='nerdyssey_s1_word';
const store={get(){try{return localStorage.getItem(KEY)}catch{return null}},set(v){try{localStorage.setItem(KEY,v)}catch{}},del(){try{localStorage.removeItem(KEY)}catch{}}};
const haptic=()=>{if(navigator.vibrate)try{navigator.vibrate(8)}catch{}};
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))haptic();});

async function tryWord(word){
  const r=await fetch('/api/s1/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word})});
  let j={};try{j=await r.json()}catch{}
  return {status:r.status,j};
}
function unlocked(value){
  const v=$('#vault');v.classList.remove('locked');v.classList.add('open');
  $('#val').textContent=value;
  $('#status').textContent='STATUS: UNLOCKED';
  $('#title').textContent='S1 // UNLOCKED';
  $('#form').classList.add('hidden');
  $('#note').textContent='— DIGIT DECRYPTED —';
  if(navigator.vibrate)try{navigator.vibrate([20,40,20])}catch{}
}
function locked(){
  $('#vault').classList.add('locked');
  $('#title').textContent='S1 // SEALED';
  $('#status').textContent='STATUS: SEALED';
  $('#val').textContent='✕';
  $('#form').classList.add('hidden');
  $('#note').textContent='— THIS DEVICE IS PERMANENTLY LOCKED OUT —';
  $('#err').textContent='';
}
function fail(msg){
  $('#err').textContent=msg;
  const f=$('#form');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
  $('#word').value='';$('#word').focus();
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const word=$('#word').value.trim();if(!word)return;
  const btn=$('#go');btn.disabled=true;btn.textContent='DECRYPTING...';$('#err').textContent='';
  try{
    const {status,j}=await tryWord(word);
    if(status===200&&j.ok){store.set(word);unlocked(j.value);}
    else if(status===429)locked();
    else if(status===503)fail('VAULT OFFLINE');
    else fail('ACCESS DENIED // '+j.left+' '+(j.left===1?'TRY':'TRIES')+' LEFT');
  }catch{fail('CONNECTION LOST');}
  btn.disabled=false;btn.textContent='UNLOCK';
});

// remembered on this device: re-check the saved word with the server
(async()=>{
  const w=store.get();if(!w)return;
  try{const {status,j}=await tryWord(w);
    if(status===200&&j.ok)unlocked(j.value);else if(status===429)locked();else if(status===401)store.del();}catch{}
})();
})();
</script>
</body>
</html>
