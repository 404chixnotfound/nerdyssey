<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030806">
<title>THE NERDYSSEY // Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030806; --panel:#0B1A14; --text:#B6FFE0; --accent:#00FF9C; --dim:#1F5A43; --red:#FF3B5C;
  --glow:0 0 8px rgba(0,255,156,.55),0 0 22px rgba(0,255,156,.25);
  --head:'Orbitron','VT323',monospace; --lcd:'VT323',monospace; --body:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;min-height:100vh;
  max-width:560px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(600px 400px at 50% -5%,rgba(0,255,156,.08),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);animation:flick 6s infinite}
@keyframes flick{0%,100%{opacity:.9}50%{opacity:1}52%{opacity:.8}54%{opacity:1}}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* corner brackets */
.br{position:relative;border:1px solid var(--dim);background:var(--panel)}
.br::before{content:"";position:absolute;inset:-1px;pointer-events:none;
  --c:var(--accent);--s:12px;
  background:
   linear-gradient(var(--c),var(--c)) top left/var(--s) 2px no-repeat,
   linear-gradient(var(--c),var(--c)) top left/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) top right/var(--s) 2px no-repeat,
   linear-gradient(var(--c),var(--c)) top right/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom left/var(--s) 2px no-repeat,
   linear-gradient(var(--c),var(--c)) bottom left/2px var(--s) no-repeat,
   linear-gradient(var(--c),var(--c)) bottom right/var(--s) 2px no-repeat,
   linear-gradient(var(--c),var(--c)) bottom right/2px var(--s) no-repeat;
  filter:drop-shadow(0 0 4px rgba(0,255,156,.6))}

/* top bar */
header{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-family:var(--head);font-weight:900;font-size:clamp(20px,6.4vw,30px);letter-spacing:.05em;color:var(--accent);
  text-shadow:var(--glow);position:relative;line-height:1;white-space:nowrap;animation:glitch 7s infinite}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;opacity:0;pointer-events:none}
.logo::before{color:#00e5ff;transform:translate(-2px,0)}
.logo::after{color:var(--red);transform:translate(2px,0)}
.logo:hover::before,.logo:hover::after,.logo:active::before,.logo:active::after{opacity:.75;animation:gshift .35s steps(2) infinite}
@keyframes gshift{0%{clip-path:inset(0 0 60% 0)}50%{clip-path:inset(40% 0 20% 0)}100%{clip-path:inset(70% 0 0 0)}}
@keyframes glitch{0%,94%,100%{transform:none}95%{transform:translate(2px,-1px) skewX(4deg)}96%{transform:translate(-2px,1px)}97%{transform:none}}
.tag{letter-spacing:.22em;color:var(--dim);font-size:10px;margin-top:-6px}
#authzone{margin-left:auto}
#authzone.adm{margin-left:0;flex-basis:100%;display:flex;gap:10px}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0 14px;min-height:44px;
  letter-spacing:.12em;font-size:12px;text-transform:uppercase;transition:.12s;display:inline-flex;gap:8px;align-items:center;justify-content:center;font-family:var(--body)}
.btn:active{transform:scale(.94);box-shadow:inset 0 0 12px rgba(0,255,156,.5)}
.btn.solid{background:var(--accent);color:#03130c;font-weight:700}
.btn.wide{width:100%;min-height:50px;font-size:14px}
.btn:disabled{opacity:.4}
.badge{flex:1;border:1px solid var(--accent);min-height:44px;display:flex;align-items:center;justify-content:center;
  letter-spacing:.1em;font-size:12px;color:var(--accent);text-shadow:var(--glow)}

/* banner */
.banner{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 14px;text-align:center;
  box-shadow:inset 0 0 40px rgba(0,255,156,.08),var(--glow)}
.banner .lab{letter-spacing:.24em;font-size:11px}
.banner .mid{font-family:var(--head);font-weight:700;font-size:clamp(19px,6.2vw,28px);letter-spacing:.06em;color:var(--accent);text-shadow:var(--glow);line-height:1.3}
.banner .mid .slash{color:var(--dim);margin:0 .3em}
.banner .right{letter-spacing:.22em;font-size:11px}
.caret{display:inline-block;width:.5em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-left:10px;
  box-shadow:0 0 10px var(--red),0 0 22px var(--red);animation:pulse 1.2s infinite;vertical-align:middle}
@keyframes pulse{50%{opacity:.25}}
.field{background:#06110c;border:1px solid var(--dim);color:var(--accent);font-family:var(--head);font-weight:700;
  padding:0 12px;min-height:48px;outline:none;letter-spacing:.06em;font-size:18px;width:100%}
.field:focus{border-color:var(--accent);box-shadow:var(--glow)}
.sess-edit{display:flex;flex-direction:column;gap:10px;width:100%}

/* profile card */
.ph{display:flex;justify-content:space-between;padding:12px 14px 0;font-size:10px;letter-spacing:.22em;color:var(--dim)}
.ph .u{color:var(--accent)}
.prof{display:grid;grid-template-columns:104px 1fr;gap:10px 14px;padding:6px 14px 14px;align-items:center}
.hexbig{width:104px;height:104px;display:block;filter:drop-shadow(0 0 10px var(--hc,#00FF9C));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.pname{font-family:var(--head);font-weight:900;font-size:clamp(20px,6.4vw,28px);letter-spacing:.06em;color:var(--accent);text-shadow:var(--glow);text-transform:uppercase;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:auto 1fr;gap:0 16px;border-top:1px solid var(--dim);padding-top:8px}
.stats small{display:block;letter-spacing:.2em;font-size:10px}
.stats b{font-family:var(--head);font-weight:700;font-size:clamp(18px,5.6vw,24px);color:var(--accent);text-shadow:var(--glow);line-height:1.3}
.gap{grid-column:1/-1;border:1px solid var(--dim);padding:0 12px;min-height:40px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.12em;font-size:11px}
.gap b{font-family:var(--head);font-weight:700;font-size:16px;color:var(--accent);letter-spacing:.03em}
.gap b.neg{color:var(--red);text-shadow:0 0 8px var(--red)}

/* list */
.cols,.row{display:grid;grid-template-columns:34px 42px minmax(0,1fr) auto;grid-template-areas:"rk tl nm pv";align-items:center;gap:8px;padding:0 12px}
.cols{font-size:10px;letter-spacing:.2em;color:var(--dim);padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--dim)}
.cols .pts{text-align:right}
.row{min-height:60px;border-bottom:1px solid rgba(31,90,67,.6);cursor:pointer;position:relative;transition:background .15s,box-shadow .15s;outline:none}
.row:active{background:rgba(0,255,156,.12)}
.row.sel{background:rgba(0,255,156,.16);box-shadow:inset 0 0 0 1px var(--accent)}
.rk{grid-area:rk;font-family:var(--lcd);font-size:26px;line-height:1}
.tl{grid-area:tl;display:flex}
.nm{grid-area:nm;font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{grid-area:pv;font-family:var(--head);font-weight:700;font-size:18px;text-align:right;letter-spacing:.02em}
.row.r1{box-shadow:inset 0 0 26px rgba(0,255,156,.25),0 0 14px rgba(0,255,156,.2)}
.row.r2{box-shadow:inset 0 0 18px rgba(0,255,156,.16)}
.row.r3{box-shadow:inset 0 0 12px rgba(0,255,156,.10)}
.row.r1 .rk,.row.r1 .nm,.row.r1 .pv{color:var(--accent);text-shadow:var(--glow)}
.row.r2 .rk,.row.r2 .nm,.row.r2 .pv{text-shadow:0 0 8px rgba(0,255,156,.5)}
.row.r3 .rk,.row.r3 .nm,.row.r3 .pv{text-shadow:0 0 5px rgba(0,255,156,.35)}
.row.sel{box-shadow:inset 0 0 0 1px var(--accent),inset 0 0 22px rgba(0,255,156,.22)}
.row.enter{animation:in .5s ease-out}
@keyframes in{from{opacity:0;transform:translateX(-20px)}}
.tile{width:40px;height:40px;display:block;filter:drop-shadow(0 0 4px var(--hc))}
.tile text,.hexbig text{font-family:var(--head);font-weight:900}
.state{padding:44px 16px;text-align:center;letter-spacing:.16em;color:var(--accent);font-family:var(--lcd);font-size:28px;grid-column:1/-1}

/* admin rows: two lines */
body.adm .cols{grid-template-columns:34px 42px minmax(0,1fr) 44px}
body.adm .row{grid-template-columns:34px 42px minmax(0,1fr) 44px;grid-template-areas:"rk tl nm dl" "ed ed ed ed";padding-bottom:12px;padding-top:8px;row-gap:10px}
.delw{grid-area:dl}
.edit{grid-area:ed;display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:8px}
.num{width:100%;min-height:46px;background:#06110c;border:1px solid var(--accent);color:var(--text);font-family:var(--head);font-weight:700;
  font-size:19px;padding:0 10px;outline:none;text-align:center;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{box-shadow:var(--glow)}
.step{min-height:46px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:24px;line-height:1;transition:.1s}
.step:active{transform:scale(.9);background:rgba(0,255,156,.2)}
.del{width:44px;height:44px;background:none;border:1px solid rgba(255,59,92,.5);color:var(--red);font-size:18px}
.del:active{transform:scale(.88);background:rgba(255,59,92,.15)}

/* add player */
.add{display:none;flex-direction:column;gap:12px;padding:16px 14px}
body.adm .add{display:flex}
.add h3{font-family:var(--head);font-size:18px;letter-spacing:.08em;color:var(--accent);text-shadow:var(--glow);font-weight:700}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:10px;align-items:center}
.arow2{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:8px}
.add select{background:#06110c;color:var(--accent);border:1px solid var(--accent);padding:0 12px;min-height:48px;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.08em;width:100%}
#addtile .tile{width:44px;height:44px}

footer{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;letter-spacing:.2em;color:var(--dim);text-align:center;
  border-top:1px solid rgba(31,90,67,.6);padding-top:10px}

/* login dialog */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:14vh 12px 12px}
.veil.on{display:flex}
.dlg{width:100%;max-width:520px;padding:26px 18px 18px;background:#07130e;box-shadow:var(--glow),0 0 60px rgba(0,0,0,.8)}
.dlg h2{font-family:var(--head);font-weight:700;font-size:24px;letter-spacing:.08em;text-align:center;color:var(--accent);text-shadow:var(--glow);
  border-bottom:1px solid var(--dim);padding-bottom:14px;margin-bottom:18px}
.dlg label{letter-spacing:.14em;font-size:14px;display:block;margin-bottom:10px}
.dlg input{width:100%;background:#06110c;border:1px solid var(--accent);color:var(--accent);padding:0 14px;min-height:52px;font-size:20px;letter-spacing:.25em;outline:none;font-family:var(--body)}
.dlg input:focus{box-shadow:var(--glow)}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.dlg .acts .btn{min-height:52px}
.dlg .note{text-align:center;margin-top:18px;font-size:10px;letter-spacing:.2em;color:var(--dim)}
.dlg .err{min-height:26px;margin:8px 0 6px;text-align:center;color:var(--red);font-family:var(--head);font-weight:700;letter-spacing:.2em;font-size:14px;text-shadow:0 0 8px var(--red)}
.x{position:absolute;top:4px;right:4px;width:44px;height:44px;background:none;border:0;color:var(--accent);font-size:26px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo" data-t="THE NERDYSSEY">THE NERDYSSEY</div>
  <div id="authzone"></div>
</header>
<div class="tag">PLAY &gt; COMPETE &gt; BELONG</div>

<section class="br banner" id="banner" aria-live="polite"></section>

<section class="br panel" id="profpanel">
  <div class="ph"><span>SELECTED PLAYER</span><span class="u" id="unit">UNIT --</span></div>
  <div class="prof" id="prof"></div>
</section>

<section class="br panel" id="listpanel">
  <div class="cols" id="cols"></div>
  <div id="list"><div class="state">LOADING DATA<span class="caret"></span></div></div>
</section>

<section class="br add" id="addbar">
  <h3>ADD PLAYER</h3>
  <div class="arow">
    <select id="addname" aria-label="Player name"></select>
    <span id="addtile"></span>
  </div>
  <div class="arow2">
    <button class="step" id="addminus" aria-label="minus">−</button>
    <input class="num" id="addpts" type="number" inputmode="numeric" min="0" value="0" aria-label="Starting P.PTS">
    <button class="step" id="addplus" aria-label="plus">+</button>
  </div>
  <button class="btn solid wide" id="addbtn">+ ADD PLAYER</button>
</section>

<footer>
  <span>THE NERDYSSEY &nbsp; v1.0.0</span>
  <span>THE ART OF CRITICAL THINKING</span>
  <span id="foot">ONLINE // --</span>
</footer>

<div class="veil" id="veil">
  <div class="br dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <button class="x" id="dclose" aria-label="Close">×</button>
    <h2 id="dt">ADMIN ACCESS</h2>
    <label for="pw">ENTER PASSWORD &gt;</label>
    <input id="pw" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off">
    <div class="err" id="derr"></div>
    <div class="acts">
      <button class="btn solid" id="dok">AUTHENTICATE</button>
      <button class="btn" id="dcancel">CANCEL</button>
    </div>
    <div class="note">— ACCESS RESTRICTED TO ADMIN —</div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const NATO=['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel','India','Juliet'];
const fmt=n=>Number(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const hue=name=>135+Math.max(0,NATO.indexOf(name))*6;   // slightly different accent shade each
const color=name=>`hsl(${hue(name)} 100% 55%)`;
const state={data:null,admin:false,sel:'Alpha',loaded:false,version:-1,err:false};
const rowEls=new Map();
const timers={};

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function hexSVG(letter,name,big){
  const ns='http://www.w3.org/2000/svg',c=color(name);
  const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 100 100');
  s.setAttribute('class',big?'hexbig':'tile');s.style.setProperty('--hc',c);
  const p=document.createElementNS(ns,'polygon');p.setAttribute('points','25,6 75,6 98,50 75,94 25,94 2,50');
  p.setAttribute('fill',`hsla(${hue(name)},100%,50%,.14)`);p.setAttribute('stroke',c);p.setAttribute('stroke-width',big?3:4);s.appendChild(p);
  if(big){const q=document.createElementNS(ns,'polygon');q.setAttribute('points','27,12 73,12 92,50 73,88 27,88 8,50');
    q.setAttribute('fill','none');q.setAttribute('stroke',c);q.setAttribute('stroke-width',1);q.setAttribute('opacity','.5');s.appendChild(q);}
  const t=document.createElementNS(ns,'text');t.setAttribute('x',50);t.setAttribute('y',big?69:66);t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size',big?58:44);t.setAttribute('fill',c);t.textContent=letter;s.appendChild(t);
  return s;
}
function haptic(){if(navigator.vibrate)try{navigator.vibrate(8)}catch{}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))haptic();});

// ---------- api ----------
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&state.admin&&url.startsWith('/api/admin')){state.admin=false;applyMode();render();}
  return {ok:r.ok,status:r.status,json:j};
}
async function poll(){
  try{
    const r=await fetch('/api/state',{cache:'no-store',credentials:'same-origin'});
    if(!r.ok)throw 0;
    const j=await r.json();
    state.err=false;
    const modeChanged=j.admin!==state.admin;
    if(j.version!==state.version||modeChanged||!state.loaded){
      state.admin=j.admin;
      ingest(j);
      if(modeChanged)applyMode();
      render();
    }
    state.loaded=true;
  }catch{
    state.err=!state.loaded;
    if(!state.loaded)render();
  }
}
function ingest(j){state.data={session:j.session,players:j.players};state.version=j.version;}
function sorted(){return [...(state.data?.players||[])].sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));}

// ---------- mode ----------
function applyMode(){
  document.body.classList.toggle('adm',state.admin);
  const z=$('#authzone');z.textContent='';z.classList.toggle('adm',state.admin);
  if(state.admin){
    z.append(el('div','badge','⚙ ADMIN // LOGGED IN'));
    const lo=el('button','btn','⏻ LOGOUT');lo.onclick=async()=>{await api('POST','/api/logout');state.admin=false;applyMode();render();};
    z.append(lo);
  }else{
    const b=el('button','btn','🔒 ADMIN');b.onclick=openLogin;z.append(b);
  }
  rowEls.clear();$('#list').textContent='';
  bannerBuilt=false;
}

// ---------- banner ----------
let bannerBuilt=false,typed='',typeTimer=null;
function typewrite(target){
  const node=$('#sesstxt');if(!node)return;
  if(typed===target)return;
  clearInterval(typeTimer);let i=0;typed=target;
  typeTimer=setInterval(()=>{node.textContent=target.slice(0,++i);if(i>=target.length)clearInterval(typeTimer);},55);
}
function renderBanner(){
  const b=$('#banner'),name=state.data?state.data.session:'';
  if(!bannerBuilt){
    b.textContent='';bannerBuilt=true;typed='';
    b.append(el('div','lab','CURRENT SESSION'));
    if(state.admin){
      const w=el('div','sess-edit');const inp=el('input','field');inp.id='sessinp';inp.maxLength=40;inp.setAttribute('aria-label','Session name');
      const sv=el('button','btn solid wide','SAVE SESSION');
      const save=async()=>{const v=inp.value.trim();if(!v)return;sv.textContent='SAVING...';
        const r=await api('PUT','/api/admin/session',{name:v});sv.textContent=r.ok?'SAVED ✓':'ERROR';
        if(r.ok){state.version=r.json.version;ingest(r.json);inp.value=r.json.session;}
        setTimeout(()=>sv.textContent='SAVE SESSION',1200);};
      sv.onclick=save;inp.onkeydown=e=>{if(e.key==='Enter')save();};
      w.append(inp,sv);b.append(w);
    }else{
      const m=el('div','mid');const t=el('span');t.id='sesstxt';
      m.append(t,el('span','slash','//'),el('span','','LIVE'),el('span','dot'));
      b.append(m,el('div','right','VIEW ONLY MODE'));
    }
  }
  if(state.admin){const i=$('#sessinp');if(i&&document.activeElement!==i&&!i.dataset.touched)i.value=name;
    i&&(i.oninput=()=>i.dataset.touched='1');}
  else typewrite(name);
}

// ---------- list ----------
function buildRow(name){
  const r=el('div','row');r.dataset.name=name;r.tabIndex=0;
  r.append(el('div','rk'),el('div','tl'),el('div','nm',name));
  if(state.admin){
    const inp=el('input','num');inp.type='number';inp.inputMode='numeric';inp.min=0;inp.setAttribute('aria-label',name+' P.PTS');
    const commit=v=>{v=Math.max(0,Math.min(9999999,Math.round(Number(v)||0)));inp.value=v;setPts(name,v);};
    inp.onclick=e=>e.stopPropagation();inp.onchange=()=>commit(inp.value);
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();e.stopPropagation();};
    const mk=(t,d)=>{const b=el('button','step',t);b.setAttribute('aria-label',(d<0?'minus ':'plus ')+name);
      b.onclick=e=>{e.stopPropagation();commit((Number(inp.value)||0)+d*10);};return b;};
    const ed=el('div','edit');ed.append(mk('−',-1),inp,mk('+',1));
    const d=el('div','delw');const x=el('button','del','🗑');x.title='Remove '+name;x.setAttribute('aria-label','Remove '+name);
    x.onclick=async e=>{e.stopPropagation();
      if(!confirm('Remove '+name.toUpperCase()+'?'))return;
      const r2=await api('DELETE','/api/admin/players/'+name);if(r2.ok){state.version=r2.json.version;ingest(r2.json);render();}};
    d.append(x);r.append(d,ed);
  }else r.append(el('div','pv'));
  r.onclick=()=>{state.sel=name;render();if(!state.admin)$('#profpanel').scrollIntoView({behavior:'smooth',block:'start'});};
  r.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===r){e.preventDefault();r.click();}};
  return r;
}
function setPts(name,v){
  const p=state.data.players.find(x=>x.name===name);if(!p)return;p.pts=v;render();
  clearTimeout(timers[name]);
  timers[name]=setTimeout(async()=>{const r=await api('PATCH','/api/admin/players/'+name,{pts:v});if(r.ok)state.version=r.json.version;},350);
}
function renderCols(){
  const c=$('#cols');c.textContent='';
  c.append(el('div','','#'),el('div',''),el('div','','CALLSIGN'));
  if(!state.admin)c.append(el('div','pts','P.PTS'));
}
function renderList(){
  const L=$('#list'),players=sorted();
  if(!state.loaded&&!state.data){L.textContent='';L.append(Object.assign(el('div','state'),{innerHTML:state.err?'CONNECTION LOST // RETRYING<span class="caret"></span>':'LOADING DATA<span class="caret"></span>'}));return;}
  if(!players.length){rowEls.clear();L.textContent='';L.append(el('div','state','NO PLAYERS YET'));return;}
  L.querySelectorAll('.state').forEach(n=>n.remove());
  const first=new Map();rowEls.forEach((e,n)=>first.set(n,e.getBoundingClientRect().top));
  const names=new Set(players.map(p=>p.name));
  rowEls.forEach((e,n)=>{if(!names.has(n)){e.remove();rowEls.delete(n);}});
  players.forEach((p,i)=>{
    let e=rowEls.get(p.name),isNew=false;
    if(!e){e=buildRow(p.name);rowEls.set(p.name,e);isNew=true;}
    e.className='row'+(i<3?' r'+(i+1):'')+(p.name===state.sel?' sel':'')+(isNew&&state.loaded?' enter':'');
    e.querySelector('.rk').textContent=pad(i+1);
    const tl=e.querySelector('.tl');if(!tl.firstChild||tl.dataset.n!==p.name){tl.textContent='';tl.append(hexSVG(p.name[0],p.name,false));tl.dataset.n=p.name;}
    if(state.admin){const inp=e.querySelector('input');if(document.activeElement!==inp)inp.value=p.pts;}
    else e.querySelector('.pv').textContent=fmt(p.pts);
    L.appendChild(e);
  });
  players.forEach(p=>{const e=rowEls.get(p.name),f=first.get(p.name);if(f==null)return;
    const d=f-e.getBoundingClientRect().top;if(!d)return;
    e.style.transition='none';e.style.transform=`translateY(${d}px)`;e.getBoundingClientRect();
    e.style.transition='transform .55s cubic-bezier(.2,.8,.2,1)';e.style.transform='';});
}

// ---------- profile ----------
function renderProfile(){
  const P=$('#prof'),list=sorted();
  if(!list.length){P.textContent='';P.append(el('div','state','NO PLAYERS YET'));$('#unit').textContent='UNIT --';return;}
  if(!list.some(p=>p.name===state.sel))state.sel=list[0].name;
  const idx=list.findIndex(p=>p.name===state.sel),p=list[idx];
  $('#unit').textContent='UNIT '+pad(NATO.indexOf(p.name)+1);
  P.textContent='';
  const info=el('div');info.append(el('div','pname',p.name));
  const st=el('div','stats');
  const a=el('div');a.append(el('small','','RANK'),el('b','','#'+pad(idx+1)));
  const b=el('div');b.append(el('small','','P.PTS'),el('b','',fmt(p.pts)));
  st.append(a,b);info.append(st);
  const g=el('div','gap');
  if(idx===0){
    if(list.length>1)g.append(el('span','','LEAD OVER #02'),el('b','','+'+fmt(p.pts-list[1].pts)));
    else g.append(el('span','','GAP'),el('b','','—'));
  }else{
    g.append(el('span','','GAP TO #'+pad(idx)),el('b','neg','-'+fmt(list[idx-1].pts-p.pts)));
  }
  P.append(hexSVG(p.name[0],p.name,true),info,g);
}

// ---------- add bar ----------
function renderAdd(){
  if(!state.admin)return;
  const sel=$('#addname'),have=new Set(state.data.players.map(p=>p.name));
  const avail=NATO.filter(n=>!have.has(n)),cur=sel.value;
  sel.textContent='';
  if(!avail.length){sel.append(new Option('ALL UNITS DEPLOYED',''));sel.disabled=true;$('#addbtn').disabled=true;$('#addtile').textContent='';return;}
  sel.disabled=false;$('#addbtn').disabled=false;
  avail.forEach(n=>sel.append(new Option(n.toUpperCase(),n)));
  sel.value=avail.includes(cur)?cur:avail[0];
  $('#addtile').textContent='';$('#addtile').append(hexSVG(sel.value[0],sel.value,false));
}
$('#addname').onchange=renderAdd;
const addv=()=>Math.max(0,Math.min(9999999,Math.round(Number($('#addpts').value)||0)));
$('#addminus').onclick=()=>$('#addpts').value=Math.max(0,addv()-10);
$('#addplus').onclick=()=>$('#addpts').value=Math.min(9999999,addv()+10);
$('#addbtn').onclick=async()=>{
  const name=$('#addname').value;if(!name)return;
  const r=await api('POST','/api/admin/players',{name,pts:addv()});
  if(r.ok){state.version=r.json.version;ingest(r.json);state.sel=name;$('#addpts').value=0;render();}
};

// ---------- render ----------
function render(){
  renderBanner();renderCols();renderList();renderProfile();renderAdd();
  $('#foot').textContent='ONLINE // '+(state.data?state.data.session:'--');
}

// ---------- login dialog ----------
function openLogin(){$('#veil').classList.add('on');$('#derr').textContent='';$('#pw').value='';setTimeout(()=>$('#pw').focus(),30);}
function closeLogin(){$('#veil').classList.remove('on');$('#pw').value='';}
async function auth(){
  const pw=$('#pw').value;if(!pw)return;
  $('#dok').textContent='AUTHENTICATING...';
  const r=await api('POST','/api/login',{password:pw});
  $('#dok').textContent='AUTHENTICATE';
  if(r.ok){closeLogin();state.version=-1;await poll();}
  else{
    $('#derr').textContent=r.status===429?'LOCKED // TRY LATER':'ACCESS DENIED';
    const d=$('#dlg');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    $('#pw').value='';$('#pw').focus();
  }
}
$('#dok').onclick=auth;$('#dcancel').onclick=closeLogin;$('#dclose').onclick=closeLogin;
$('#pw').onkeydown=e=>{if(e.key==='Enter')auth();};
$('#veil').onclick=e=>{if(e.target.id==='veil')closeLogin();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLogin();});

// ---------- boot ----------
applyMode();render();poll();
setInterval(poll,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
})();
</script>
</body>
</html>
